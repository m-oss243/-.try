<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pogoda — Voronezh</title>
  <style>
    :root{--bg:#07101a;--card:#0e1a24;--accent:#7adfff;--muted:#9fb1bd;--text:#e6eef3}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#02101a 0%,#04121b 100%);color:var(--text)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:760px;background:var(--card);border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
    h1{margin:0 0 6px;font-size:32px;letter-spacing:-0.02em}
    p.lead{margin:0 0 18px;color:var(--muted)}
    form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    input[type="text"]{flex:1;min-width:180px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--text);outline:none}
    button{padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:#012;cursor:pointer;font-weight:600}
    .result{margin-top:8px}
    .row{display:flex;align-items:center;gap:14px}
    .temp{font-size:48px;font-weight:700}
    .desc{font-size:18px;color:var(--muted)}
    .meta{margin-top:8px;color:var(--muted);font-size:14px}
    .footer{margin-top:18px;color:var(--muted);font-size:13px}
    .error{color:#ffb4b4;background:rgba(255,180,180,.06);padding:10px;border-radius:8px}
    .loader{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    a.link{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main">
      <h1>pogoda-try</h1>
      <p class="lead">Показывает текущую погоду через защищённую серверную функцию (Netlify). Ключ хранится в переменной окружения OPENWEATHER_KEY на Netlify.</p>

      <form id="searchForm" onsubmit="return false;">
        <input id="cityInput" type="text" placeholder="Город, например Voronezh" value="Voronezh" aria-label="Город">
        <button id="btnGet">Получить</button>
        <div id="status" style="align-self:center;margin-left:8px"></div>
      </form>

      <div id="output" class="result" aria-live="polite"></div>

      <div class="footer">
        Репозиторий: <a class="link" href="https://github.com/m-oss243/-.try" target="_blank" rel="noopener">m-oss243/-.try</a><br>
        Если хотите — я могу помочь автоматически добавить файлы в репо или показать, как настроить Netlify.
      </div>
    </div>
  </div>

<script>
const form = document.getElementById('searchForm');
const cityInput = document.getElementById('cityInput');
const output = document.getElementById('output');
const status = document.getElementById('status');
const btn = document.getElementById('btnGet');

function setLoading(on){
  status.innerHTML = on ? '<span class="loader" aria-hidden="true"></span>' : '';
  btn.disabled = on;
}

async function getWeather(city){
  setLoading(true);
  output.innerHTML = '';
  try{
    const res = await fetch(`/.netlify/functions/get-weather?city=${encodeURIComponent(city)}`);
    if(!res.ok){
      const text = await res.text();
      throw new Error(text || 'Ошибка от сервера');
    }
    const data = await res.json();
    renderWeather(data);
  }catch(e){
    output.innerHTML = `<div class="error">Ошибка: ${escapeHtml(e.message)}</div>`;
  }finally{
    setLoading(false);
  }
}

function renderWeather(data){
  if(!data || !data.main){ output.innerHTML = `<div class="error">Неверный ответ от API</div>`; return }
  const name = data.name || '';
  const t = Math.round(data.main.temp);
  const feels = Math.round(data.main.feels_like);
  const desc = data.weather && data.weather[0] ? data.weather[0].description : '';
  const icon = data.weather && data.weather[0] ? data.weather[0].icon : '';
  const humidity = data.main.humidity;
  const wind = data.wind ? data.wind.speed : null;
  output.innerHTML = `
    <div class="row">
      <div>
        <div class="temp">${t}°C</div>
        <div class="desc">${capitalize(desc)} — ${name}</div>
        <div class="meta">Ощущается как ${feels}°C · Влажность ${humidity}%${wind? ' · Ветер ' + wind + ' м/с' : ''}</div>
      </div>
      ${icon ? `<img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${desc}" width="80" height="80">` : ''}
    </div>
  `;
}

function capitalize(s){ return s? s[0].toUpperCase()+s.slice(1):'' }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]) }

form.addEventListener('submit', ()=> getWeather(cityInput.value.trim()));
btn.addEventListener('click', ()=> getWeather(cityInput.value.trim()));

// auto-load default
getWeather(cityInput.value.trim());
</script>
</body>
</html>
